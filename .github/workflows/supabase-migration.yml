name: Apply Supabase Migrations

on:
  push:
    branches: [ main, develop, "claude/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ljpdwezgahrrffnwajho.supabase.co
      SUPABASE_PROJECT_REF: ljpdwezgahrrffnwajho
      # 🔐 These should be added as GitHub Secrets:
      # SUPABASE_SERVICE_ROLE_KEY
      # DATABASE_PASSWORD

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link to Supabase Project
        run: |
          supabase link \
            --project-ref ljpdwezgahrrffnwajho \
            --password "${{ secrets.DATABASE_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Push Migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SUPABASE_DB_URL: postgresql://postgres:${{ secrets.DATABASE_PASSWORD }}@db.ljpdwezgahrrffnwajho.supabase.co:5432/postgres

      - name: Verify Migration Status
        run: supabase migration list

      - name: Send Notification (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Supabase migration failed. Please check the workflow logs.'
            })
