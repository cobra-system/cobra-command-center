name: Apply Supabase Migrations

on:
  push:
    branches: [ main, develop, "claude/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Resolve database IPv4
        run: |
          DB_IPV4=$(getent ahostsv4 db.ljpdwezgahrrffnwajho.supabase.co | awk '{print $1}' | head -1)
          echo "DB_IPV4=$DB_IPV4" >> $GITHUB_ENV
          echo "Resolved host to IPv4: $DB_IPV4"

      - name: Run migrations
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          for file in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying migration: $file"
            psql "postgresql://postgres:$PGPASSWORD@$DB_IPV4:5432/postgres?sslmode=require" -f "$file" --set ON_ERROR_STOP=0 || true
          done
          echo "All migrations applied!"

      - name: Verify database connection
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          psql "postgresql://postgres:$PGPASSWORD@$DB_IPV4:5432/postgres?sslmode=require" -c "SELECT count(*) as table_count FROM information_schema.tables WHERE table_schema = 'public';" || echo "Warning: Could not verify connection"
