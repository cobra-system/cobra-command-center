name: Advance Overdue Tasks

on:
  schedule:
    # Run daily at 6 AM UTC (can be adjusted as needed)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  advance-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Call Advance Overdue Tasks Edge Function
        run: |
          echo "Starting advance overdue tasks job..."

          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set. Configure it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set. Configure it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Construct the Edge Function URL
          EDGE_FUNCTION_URL="${SUPABASE_URL}/functions/v1/advance-overdue-tasks"

          echo "Calling Edge Function at ${SUPABASE_URL%%.*}..../functions/v1/advance-overdue-tasks"

          # Call the Edge Function
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST "$EDGE_FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY")
          CURL_EXIT=$?
          RESPONSE=$(cat /tmp/response.json)

          if [ $CURL_EXIT -ne 0 ]; then
            echo "::error::curl failed with exit code $CURL_EXIT"
            exit 1
          fi

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $RESPONSE"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Edge function returned HTTP $HTTP_STATUS"
            exit 1
          fi

          # Check if response indicates success
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Advance overdue tasks completed successfully"
            exit 0
          else
            echo "::error::Task advancement failed - response did not indicate success"
            echo "$RESPONSE"
            exit 1
          fi

      - name: Log job completion
        if: always()
        run: |
          echo "Advance overdue tasks job completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
